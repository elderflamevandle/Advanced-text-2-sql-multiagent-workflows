name: CI

on:
  push:
    branches: [main, dev, test, qa, prod]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        # Not blocking until the existing findings (long lines, unused imports) are cleaned up.
        continue-on-error: true
        run: uv run ruff check .
      - name: Unit tests
        # tests/vector needs the embedding model and a vector store; run those separately.
        run: uv run pytest -q --ignore=tests/vector
        env:
          GROQ_API_KEY: test
          OPENAI_API_KEY: test
