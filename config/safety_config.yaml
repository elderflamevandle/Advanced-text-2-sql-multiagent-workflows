# SQL safety policy, enforced by database/safety.py::scan_sql on every generated query.
#
# The scanner parses the SQL with sqlglot and allows exactly one read-only query
# (SELECT, optionally WITH-wrapped, set operations, parenthesised subqueries).
# Anything else is blocked, including SQL that cannot be parsed.
safety:
  # Root statement kinds that may run. Remove WITH to forbid CTEs.
  allowed_statements: [SELECT, WITH]

  # Informational only: every statement kind that is not allowed above is blocked,
  # whether or not it appears in this list.
  blocked_statements: [DROP, DELETE, TRUNCATE, UPDATE, INSERT, ALTER, CREATE, GRANT, REVOKE]

  audit_logging: true

  # Block locking reads: SELECT ... FOR UPDATE / FOR SHARE / LOCK IN SHARE MODE.
  block_locking_reads: true

  # Block MySQL/MariaDB executable comments (/*! ... */ and /*M! ... */), which the
  # server runs as SQL even though parsers treat them as comments.
  block_executable_comments: true

  # DuckDB can read a file by naming it as a table: SELECT * FROM 'data.csv'.
  # Block table names that look like a path, URL, glob or data file.
  # Applies when the dialect is duckdb or unknown.
  block_file_tables: true
  file_table_extensions:
    [csv, tsv, txt, parquet, json, jsonl, ndjson, xlsx, db, duckdb, sqlite, gz, zst, arrow]

  # Function denylist. Names are case-insensitive and may use shell-style wildcards
  # (pg_read_*). The groups are only for readability: every entry is enforced for
  # every dialect, so a wrong or missing db_type cannot open a hole.
  blocked_functions:
    postgres:
      - pg_sleep*
      - pg_read_*
      - pg_ls_*
      - pg_stat_file
      - pg_file_*
      - pg_terminate_backend
      - pg_cancel_backend
      - pg_reload_conf
      - pg_rotate_logfile
      - pg_promote
      - pg_switch_wal
      - pg_create_restore_point
      - pg_backup_*
      - pg_start_backup
      - pg_stop_backup
      - pg_wal_replay_*
      - pg_*replication_slot*
      - pg_logical_emit_message
      - pg_advisory_*
      - pg_try_advisory_*
      - lo_*
      - loread
      - lowrite
      - dblink*
      - set_config
      - setval
      - nextval
      - query_to_xml*
      - table_to_xml*
      - schema_to_xml*
      - database_to_xml*
      - cursor_to_xml*
    mysql:
      - load_file
      - sleep
      - benchmark
      - get_lock
      - release_lock
      - release_all_locks
      - master_pos_wait
      - source_pos_wait
      - sys_exec
      - sys_eval
    sqlite:
      - load_extension
      - readfile
      - writefile
      - edit
      - fts3_tokenizer
    duckdb:
      - read_*
      - "*_scan"
      - scan_*
      - sniff_csv
      - glob
      - parquet_*
      - sqlite_attach
      - postgres_attach
      - postgres_query
      - postgres_execute
      - mysql_query
      - mysql_execute
      - st_read*
      - getenv
      - query
      - query_table
      - which_secret
      - duckdb_secrets
      - load_aws_credentials
      - http_get
      - http_post

execution:
  timeout_seconds: 60
  max_rows: 1000
